<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>프론티어 아웃포스트 · 현장 작전</title><link rel="stylesheet" href="./lab/battle-ui.css"></head>
<body data-battle="true">
<main id="battle-stage" aria-label="현장 작전">
  <canvas id="view" width="1280" height="720" aria-label="전투 전장"></canvas>
  <div id="loading" role="status">지표 통신 연결 중</div>
  <header class="mission-header">
    <div class="mission-origin"><span class="overline">프론티어 아웃포스트</span><span class="sector">탐사 구역 07</span><span id="link-state" class="link-state">통신 양호</span></div>
    <div class="mission-objective"><span class="overline">현장 의뢰 · 관측망 복구</span><strong id="mission-title">관측 지점 확보</strong><div class="objective-bottom"><progress id="mission-progress" max="100" value="0" aria-label="임무 진행률"></progress><span id="mission-percent">0%</span></div></div>
    <div class="top-tools"><span id="mission-clock">00:00</span><button id="pause-action" class="icon-button" title="일시 정지" aria-label="일시 정지"></button></div>
  </header>
  <aside class="map-hud"><div class="map-title"><span>지표 스캔</span><span id="zone">착륙 지점</span></div><canvas id="minimap" width="240" height="140" aria-label="전장 미니맵"></canvas><button id="objective-action" class="objective-action" title="목표 지점 보기"><span id="objective-icon"></span><span id="objective-distance">목표 지점</span></button></aside>
  <div class="field-message" role="status"><span id="order">착륙 완료</span></div>
  <div class="bottom-hud"><section id="crew" class="crew" aria-label="출격 대원"></section><nav class="command-tools" aria-label="분대 명령"><button id="center-action" class="icon-button" title="선택 대원 중앙 정렬" aria-label="선택 대원 중앙 정렬"></button><button id="stop" class="icon-button" title="분대 정지" aria-label="분대 정지"></button><button id="equipment-action" class="icon-button" title="장비" aria-label="장비"></button><button id="fullscreen-action" class="icon-button" title="전체 화면" aria-label="전체 화면"></button></nav></div>
  <dialog id="battle-menu"><div class="dialog-heading"><h1 id="menu-title">작전 일시 정지</h1><button class="icon-button close-menu" aria-label="닫기" title="닫기"></button></div><p id="menu-result" hidden></p><div id="equipment-panel" hidden><label for="weapon">선택 대원 무기</label><select id="weapon" aria-label="무기군"></select><div id="readout"></div></div><button class="menu-command" id="resume-action">작전 계속</button><button type="button" class="menu-command" id="reset">다시 출격</button></dialog>
  <div hidden id="developer-controls"><span id="status"></span><div id="targets"></div><div id="zones"></div><label><input id="follow" type="checkbox" checked>대원 추적</label><label><input id="fog" type="checkbox" checked>전장 안개</label><label><input id="hits" type="checkbox">충돌 영역</label><label><input id="range" type="checkbox">무기 사거리</label><input id="zoom" type="range" min="55" max="180" value="100"><output id="zoomValue">100%</output></div>
</main><script type="module" src="./lab/field-map.js"></script></body></html>
