    panel(LW/2-96,LH/2-36,192,66,'rgba(12,9,6,.95)',secured?C.brass:C.bad);
    text(secured?'부지 확보':'작전 실패',LW/2,LH/2-27,{size:16,color:secured?C.brassHi:C.bad,align:'center',weight:800});
    text(secured?('전초기지 가동 · 회수 자원 '+resources):'분대를 잃었다',LW/2,LH/2-6,{size:9,color:C.dim,align:'center'});
    text('처치 '+killed+' · 탐사 '+(()=>{let n=0;for(let i=0;i<FOG.length;i++)if(FOG[i])n++;return Math.round(n/FOG.length*100);})()+'%',
      LW/2,LH/2+7,{size:9,color:C.dim,align:'center'});
    text('R — 새 지형으로 다시',LW/2,LH/2+20,{size:9,color:C.brass,align:'center'});
  }
  /* 힌트 */
  const hintOn=CLOCK<hintT;
  if(hintOn){ panel(LW/2-124,LH-ch-30,248,18,'rgba(14,11,8,.92)');
    text(hint,LW/2,LH-ch-26,{size:9,color:C.brassHi,align:'center'}); }
  /* 모바일 컨트롤 */
  if(MOBILE){
    const fx=LW-46,fy=LH-70;
    P.strokeStyle=fireBtn?C.brassHi:'rgba(200,162,74,.55)'; P.lineWidth=2;
    P.beginPath(); P.arc(fx,fy,26,0,6.283); P.stroke();
    P.fillStyle=fireBtn?'rgba(200,162,74,.28)':'rgba(20,15,10,.55)';
    P.beginPath(); P.arc(fx,fy,25,0,6.283); P.fill();
    text('사격',fx,fy-4,{size:10,color:C.brassHi,align:'center'});
    addHit(fx-28,fy-28,56,56,'fire');
    if(stick.on&&stick.ox!==undefined){
      P.strokeStyle='rgba(230,220,196,.35)';
      P.beginPath(); P.arc(stick.ox,stick.oy,26,0,6.283); P.stroke();
      P.fillStyle='rgba(230,220,196,.5)';
      P.beginPath(); P.arc(stick.ox+stick.dx*22,stick.oy+stick.dy*22,8,0,6.283); P.fill();
    }
  } else if(!hintOn){
    text('WASD 이동 · 좌클릭 사격 · 우클릭 이동 · 1~4 대원 · ` 태세 순환 · E 특기 · Q 경로 자료 · G 투하 · Z/X/C 보급 · O 궤도 폭격 · B 바리케이드 · R 재생성',
      LW/2,LH-ch-15,{size:8,color:C.fade,align:'center'});
  }
  /* 0037 — 조준 모드: OS 커서를 숨기고(layout 근처 mousedown/beginTargeting 참고) 대신
     화면 좌표계에 큰 빨간 조준점을 직접 그린다. 위험한 호출(궤도 폭격)은 더 굵고 진하게. */
  if(targetPick){
    const danger=SUPPLY[targetPick].danger;
    const col=danger?'rgba(230,60,50,.95)':'rgba(230,197,109,.95)';
    const x=mouse.x, y=mouse.y, R=danger?11:9, gap=danger?4:3;
    U.strokeStyle=col; U.lineWidth=danger?2:1.5;
    U.beginPath(); U.arc(x,y,R,0,6.283); U.stroke();
    U.beginPath();
    U.moveTo(x-R-6,y); U.lineTo(x-gap,y); U.moveTo(x+gap,y); U.lineTo(x+R+6,y);
    U.moveTo(x,y-R-6); U.lineTo(x,y-gap); U.moveTo(x,y+gap); U.lineTo(x,y+R+6);
    U.stroke();
    U.fillStyle=col; U.beginPath(); U.arc(x,y,1.6,0,6.283); U.fill();
    text(SUPPLY[targetPick].name+' 지정 중 — 클릭 확정 · 우클릭/ESC 취소',x,y+R+14,
      {size:8,color:C.brassHi,align:'center'});
  }
}

/* ═══ 10. 입력 ═══════════════════════════════════════════════ */
function toLogical(cx,cy){
  const r=pxc.getBoundingClientRect();
  return {x:(cx-r.left)/VIEW.scale, y:(cy-r.top)/VIEW.scale};
}
function onHud(lx,ly){
  const l=hitAt(lx,ly);
  if(!l)return false;
  if(l.startsWith('stance:')){ stance=l.slice(7); say('태세 — '+dial().name+' · '+ (stance==='recon'?'교전 회피, 발각 시 이탈':stance==='kill'?'선제 사격, 발각 시 즉시 돌격':'적이 인지했을 때만 사격'),3); }
  else if(l.startsWith('sel:')){ SEL=+l.slice(4); camLocked=true; }
  else if(l==='cmd') useCmd();
  else if(l==='fire') fireBtn=true;
  else if(l==='routes') showRoutes=false;
  else if(l==='drop') requestDrop();
  else if(l.startsWith('sup:')) requestSupply(l.slice(4));
  return true;
}
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(k>='1'&&k<='4'){ const idx=+k-1; if(units[idx]&&!units[idx].down){ SEL=idx; camLocked=true; } }
  if(k==='`'||k==='tab'){
    e.preventDefault();
    const ci=STANCE_KEYS.indexOf(stance);
    stance=STANCE_KEYS[(ci+1)%STANCE_KEYS.length];
    say('태세 — '+dial().name,2);
  }
  if(k==='e') useCmd();
  if(k==='m'){ camLocked=!camLocked; say(camLocked?'카메라 고정':'카메라 자유',1.6); }
  if(k==='q'){ showRoutes=!showRoutes; say(showRoutes?'사전 정찰 자료 — 후보 경로 표시':'경로 자료 닫음',1.8); }
  if(k==='t'){ showGrid=!showGrid; say(showGrid?'디버그 격자 — 타일 충돌 표시':'디버그 격자 숨김',1.6); }
  if(k==='g') requestDrop();
  if(k==='z') requestSupply('ammo');
  if(k==='x') requestSupply('med');
  if(k==='c') requestSupply('mine');
  if(k==='o') requestSupply('strike');
  if(k==='b') placeBarricade();
  if(k==='r') startRun();
  if(k==='escape') cancelTargeting();
  if(k===' ') e.preventDefault();
});
addEventListener('keyup',e=>{ keys[e.key.toLowerCase()]=false; });
pxc.addEventListener('mousemove',e=>{
  const l=toLogical(e.clientX,e.clientY);
  mouse.x=l.x; mouse.y=l.y;
  const w=S2W(l.x,l.y); mouse.wx=w.x; mouse.wy=w.y;
});
pxc.addEventListener('mousedown',e=>{
  const l=toLogical(e.clientX,e.clientY);
  if(targetPick){
    /* 조준 모드 — 좌클릭 확정, 우클릭 취소. 평소의 사격/이동-명령 처리는 건너뛴다. */
    e.preventDefault();
    if(e.button===2) cancelTargeting();
    else confirmTargeting(mouse.wx,mouse.wy);
    return;
  }
  if(e.button===2){
    e.preventDefault();
    const w=S2W(l.x,l.y);
    const u=units[SEL];
    if(u&&!u.down){ const p=findPath(u.x,u.y,w.x,w.y); if(p){ u.path=p; floats.push({x:w.x,y:w.y,txt:'이동',life:1,col:C.brassHi}); } }
    return;
  }
  if(onHud(l.x,l.y))return;
  mouse.down=true;
});
addEventListener('mouseup',()=>{ mouse.down=false; fireBtn=false; });
pxc.addEventListener('wheel',e=>{
  e.preventDefault();
  const l=toLogical(e.clientX,e.clientY);
  const before=S2W(l.x,l.y);
  ZOOM=clamp(ZOOM*Math.exp(-e.deltaY*0.0012), ZOOM_MIN, ZOOM_MAX);
  const after=S2W(l.x,l.y);
  cam.x+=before.x-after.x; cam.y+=before.y-after.y;
},{passive:false});
pxc.addEventListener('contextmenu',e=>e.preventDefault());
/* 모바일 — 왼쪽 절반 드래그는 이동 스틱, 오른쪽 버튼은 사격 */
pxc.addEventListener('touchstart',e=>{
  MOBILE=true; e.preventDefault();
  for(const t of e.changedTouches){
    const l=toLogical(t.clientX,t.clientY);
    if(onHud(l.x,l.y)){ if(hitAt(l.x,l.y)==='fire') stick.fireId=t.identifier; continue; }
    if(l.x<LW*0.5){ stick.on=true; stick.id=t.identifier; stick.ox=l.x; stick.oy=l.y; stick.dx=0; stick.dy=0; }
  }
},{passive:false});
pxc.addEventListener('touchmove',e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    if(t.identifier!==stick.id)continue;
    const l=toLogical(t.clientX,t.clientY);
    let dx=l.x-stick.ox, dy=l.y-stick.oy;
    const m=Math.hypot(dx,dy);
    if(m>4){ const n=Math.min(1,m/26); stick.dx=dx/m*n; stick.dy=dy/m*n; }
    else { stick.dx=0; stick.dy=0; }
  }
},{passive:false});
const endTouch=e=>{
  for(const t of e.changedTouches){
    if(t.identifier===stick.id){ stick.on=false; stick.id=-1; stick.dx=0; stick.dy=0; }
    if(t.identifier===stick.fireId){ fireBtn=false; stick.fireId=-1; }
  }
};
pxc.addEventListener('touchend',endTouch); pxc.addEventListener('touchcancel',endTouch);

/* ═══ 11. 메인 루프 ══════════════════════════════════════════ */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt);
  P.clearRect(0,0,LW,LH); U.clearRect(0,0,LW,LH);
  drawWorld();
  drawHUD();
  requestAnimationFrame(frame);
}
layout(); startRun(); requestAnimationFrame(frame);

/* 테스트 훅 */
window.__proto={
  state:()=>({clock:+CLOCK.toFixed(1),sel:SEL,stance,alarm,killed,resources,
    phase:PHASE,scan:+scanT.toFixed(1),scanned:SCANNED,eta:+dropETA.toFixed(1),
    atkTotal,atkSpawned,alive:attackersAlive(),
    safety:Math.round(safety),secured,failed,patrols:patrolsLeft(),
    module:MODULE?{landed:MODULE.landed,hp:Math.round(MODULE.hp)}:null,
    mines:mines.length,crates:crates.length,barricadesLeft,barricades:barricadeList.length,
    routes:ROUTES.map(r=>({name:r.name,len:r.len,patrols:r.patrols,slow:r.slow})),
    units:units.map(u=>({n:u.crew.name,hp:Math.round(u.hp),st:u.state,traits:u.crew.traits,lvl:u.crew.lvl,x:Math.round(u.x),y:Math.round(u.y)})),
    enemies:enemies.map(e=>({hp:Math.round(e.hp),aware:+e.aware.toFixed(2),x:Math.round(e.x),y:Math.round(e.y)})),
    fog:(()=>{let s=0;for(let i=0;i<FOG.length;i++)if(FOG[i])s++;return Math.round(s/FOG.length*100);})(),
    targeting:targetPick, supply:Object.fromEntries(Object.entries(SUPPLY).map(([k,v])=>[k,v.stock]))}),
  click:l=>{ for(const r of hits) if(r.label===l){ onHud(r.x+1,r.y+1); return true; } return false; },
  tp:(x,y)=>{ for(const u of units){u.x=x+u.i*8;u.y=y;} cam.x=x; cam.y=y; updateFog(); },
  drop:()=>requestDrop(), sup:k=>requestSupply(k),
  aim:(x,y)=>confirmTargeting(x,y), cancelAim:()=>cancelTargeting(),
  seed:s=>{ SEEDN=s; startRun(); },
};
</script></body></html>
