<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>프론티어 아웃포스트 · 미개척 행성</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0b1113;color:#c4d3d0;font:13px/1.5 "Malgun Gothic",system-ui,sans-serif}button,select,input{font:inherit}button,select{background:#152326;color:#b9e9e0;border:1px solid #365456;padding:7px;cursor:pointer}button:hover{background:#23403f}button.active{border-color:#69dbc0;background:#20443d}button:focus-visible,select:focus-visible{outline:2px solid #8ee6ff}header{padding:10px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #2c4245}h1{font-size:17px;margin:0}header span{font-size:11px;color:#829e9f}a{color:#90cfdc}.layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:12px;padding:12px;max-width:1600px;margin:auto}.battle{min-width:0}.viewport{position:relative;aspect-ratio:8/5;background:#131c1b;border:1px solid #365456;overflow:hidden}#view{display:block;width:100%;height:100%;image-rendering:pixelated;touch-action:none}.status{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:11px;color:#89b0aa}.crew{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}.crew button{min-height:64px;text-align:left;padding:8px}.crew b{display:block;font-size:13px}.crew small{display:block;color:#9ab6b1;font-size:11px}.side{border-left:1px solid #2c4245;padding-left:12px;min-width:0}.side section{padding:10px 0;border-bottom:1px solid #253a3c}.side h2{font-size:12px;margin:0 0 8px;color:#94c9c1}#minimap{width:100%;aspect-ratio:12/7;display:block;image-rendering:pixelated;cursor:crosshair;touch-action:none;border:1px solid #365456}.tools{display:flex;gap:6px}.tools button{flex:1;font-size:12px}label{display:flex;align-items:center;gap:6px;font-size:12px;margin:7px 0}input[type=checkbox]{accent-color:#69dcbf}select{width:100%}#readout,#targets{font-size:11px;white-space:pre-line;color:#9abdb6;overflow-wrap:anywhere}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#131c1b;color:#8be3ca}.zones{display:grid;grid-template-columns:1fr 1fr;gap:5px}.zones button{font-size:11px;padding:6px}.zoom{width:100%}footer{padding:8px 12px;font-size:11px;color:#809c9d}@media(max-width:850px){.layout{grid-template-columns:minmax(0,1fr) 180px;padding:8px;gap:8px}header{padding:8px}header span{display:none}.crew b{font-size:11px}.crew button{padding:5px}.side{padding-left:8px}}@media(max-width:600px){.layout{grid-template-columns:1fr}.side{border-left:0;border-top:1px solid #2c4245;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.side section{min-width:0}h1{font-size:15px}.status{flex-wrap:wrap}.crew{gap:4px}.crew button{min-height:60px}.crew small{font-size:10px}}
.layout{max-width:min(1600px,calc((100dvh - 170px)*1.6 + 266px))}.side{max-height:calc(100dvh - 80px);overflow-y:auto;overflow-x:hidden}@media(max-width:600px){.layout{max-width:none}.side{max-height:none;overflow:visible}}
</style></head>
<body><header><h1>행성 탐사 · 미개척 지대</h1><span>전장 실증 01 · 1920 × 1120</span><a href="./terrain-demo.html">판정실</a></header>
<main class="layout"><div class="battle"><div class="viewport"><canvas id="view" width="960" height="600" aria-label="탐사 전장"></canvas><div id="loading">현장 자료 수신 중</div></div><div class="status"><span id="status">대기</span><span id="order">착륙 완료</span></div><div id="crew" class="crew"></div></div>
<aside class="side"><section><h2>현장 지도</h2><canvas id="minimap" width="240" height="140" aria-label="현장 미니맵"></canvas><div id="zone">착륙 구역</div></section>
<section><h2>선택 대원</h2><select id="weapon" aria-label="무기군"></select><div id="readout"></div></section>
<section><h2>관측</h2><label><input id="follow" type="checkbox" checked>대원 추적</label><label><input id="fog" type="checkbox" checked>전장 안개</label><label><input id="hits" type="checkbox">충돌 영역</label><label><input id="range" type="checkbox" checked>무기 사거리</label><label for="zoom">배율 <output id="zoomValue">100%</output></label><input class="zoom" id="zoom" aria-label="배율" type="range" min="55" max="180" value="100"></section>
<section><h2>관측 지점</h2><div id="zones" class="zones"></div></section>
<section><h2>표적 판정</h2><div id="targets"></div></section>
<section><div class="tools"><button id="stop">정지</button><button id="reset">초기화</button></div></section></aside></main>
<footer>미개척 지대 · 설치 예정지 확보 전</footer><script type="module" src="./field-map.js"></script></body></html>
